name: Remove preview when PR closes

on:
  pull_request:
    types: [closed]

permissions:
  contents: write
  pull-requests: write

jobs:
  delete-preview:
    runs-on: ubuntu-latest
    env:
      PREVIEW_DIR: pr-${{ github.event.pull_request.number }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set tagger identity
        run: |
          git config --local user.name  "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"

      - name: Remove folder and push
        run: |
          git rm -rf $PREVIEW_DIR || true
          if git diff --cached --quiet; then
            echo "Nothing to delete."
            exit 0
          fi
          git commit -m "Remove preview for $PREVIEW_DIR (PR closed)"
          git push

      - name: Comment cleaned up
        uses: actions/github-script@v7
        with:
          script: |
            const cleanupMessage = "🧹 Preview environment for this PR has been removed.";
            
            // Find existing preview comment
            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100
            });
            
            const botComments = comments.data.filter(comment => 
              comment.user.type === 'Bot' && 
              comment.body.includes('**Preview built**')
            );
            
            if (botComments.length > 0) {
              // Update existing comment
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComments[0].id,
                body: cleanupMessage
              });
            } else {
              // Create new comment
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: cleanupMessage
              });
            }