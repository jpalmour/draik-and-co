name: PR Preview & Validation

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write        # allow pushing to gh‑pages
  pull-requests: write   # allow commenting

jobs:
  preview-and-validate:
    runs-on: ubuntu-latest
    concurrency:
      group: pr-${{ github.event.pull_request.number }}
      cancel-in-progress: true

    env:
      PR_NUM: ${{ github.event.pull_request.number }}
      PREVIEW_DIR: pr-${{ github.event.pull_request.number }}

    steps:
      - uses: actions/checkout@v4

      - name: Build Hugo site
        uses: ./.github/actions/hugo-build
        with:
          environment: "pr-preview"
          baseURL: "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/pr-${{ github.event.pull_request.number }}"
          version-id: "${{ github.sha }}"
          
      - name: Create preview directory structure
        run: |
          mkdir -p public/${{ env.PREVIEW_DIR }}
          # Move Hugo's output into the preview directory
          mv public/* public/${{ env.PREVIEW_DIR }}/ 2>/dev/null || true

      - name: Set tagger identity
        run: |
          git config --local user.name  "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"

      - name: Push to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public/${{ env.PREVIEW_DIR }}
          publish_branch: gh-pages
          destination_dir: ${{ env.PREVIEW_DIR }}
          commit_message: "Preview for PR #${{ env.PR_NUM }}: ${{ github.sha }}"
          keep_files: true             # don't wipe other previews

      - name: Comment preview link
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.issue.number;
            const url = `https://${context.repo.owner}.github.io/${context.repo.repo}/pr-${pr}/`;
            const body = `🔍 **Preview built**: <${url}>`;
            
            // Find existing comment
            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100
            });
            
            const botComments = comments.data.filter(comment => 
              comment.user.type === 'Bot' && 
              comment.body.includes('**Preview built**')
            );
            
            if (botComments.length > 0) {
              // Update existing comment
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComments[0].id,
                body
              });
            } else {
              // Create new comment
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body
              });
            }
            
      - name: Verify deployment and wait for version to be available
        uses: ./.github/actions/verify-deployment
        with:
          url: "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/pr-${{ github.event.pull_request.number }}/"
          expected-version: "${{ github.sha }}"